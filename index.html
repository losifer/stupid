<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STUPID INTELLIGENCE</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05010f; overflow: hidden; }
    canvas { display: block; cursor: grab; touch-action: none; }
    canvas.dragging { cursor: grabbing; }
    #fallback {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #e8e8ff; font: 900 clamp(2rem, 8vw, 6rem)/1 Impact, "Arial Black", sans-serif;
      text-align: center; letter-spacing: 0.05em; pointer-events: none;
      text-shadow: 0 0 20px #ff2bd6;
    }
    #fallback[hidden] { display: none; }
    /* Black curtain over everything on load; fades out once the title is ready. */
    #intro {
      position: fixed; inset: 0; z-index: 2; background: #000; pointer-events: none;
      transition: opacity 2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #intro.done { opacity: 0; }
    #sound-toggle {
      position: fixed; z-index: 1;
      top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
      width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
      border: 1px solid rgba(232, 222, 255, 0.35); border-radius: 50%;
      background: rgba(20, 4, 48, 0.55); color: rgba(232, 222, 255, 0.85);
      box-shadow: 0 0 10px rgba(255, 43, 214, 0.35);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      cursor: pointer; transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    #sound-toggle:hover, #sound-toggle:focus-visible {
      color: #fff; border-color: rgba(255, 43, 214, 0.9);
      box-shadow: 0 0 16px rgba(255, 43, 214, 0.7);
    }
    #sound-toggle:focus-visible { outline: 2px solid #2be8ff; outline-offset: 3px; }
    #sound-toggle svg { width: 16px; height: 16px; fill: currentColor; }
    #sound-toggle .icon-pause, #sound-toggle[aria-pressed="true"] .icon-play { display: none; }
    #sound-toggle[aria-pressed="true"] .icon-pause { display: block; }
    footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      padding: 0 16px max(16px, env(safe-area-inset-bottom));
      text-align: center; pointer-events: none;
      color: rgba(232, 222, 255, 0.7);
      font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      text-shadow: 0 0 8px rgba(255, 43, 214, 0.6);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="intro"></div>
  <div id="fallback" hidden>STUPID<br />INTELLIGENCE (SI)</div>
  <button id="sound-toggle" type="button" aria-label="Play music" aria-pressed="false" aria-keyshortcuts="Space" title="Play/pause (Space)">
    <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9.5-5.5z" /></svg>
    <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z" /></svg>
  </button>
  <audio id="music" src="sound/Gated%20Minor%20Chords.mp3" loop preload="auto"></audio>
  <footer>&copy; 2026 - Built using Stupid Intelligence (SI)</footer>

  <script type="module">
    import * as THREE from 'three';
    import { FontLoader } from 'three/addons/loaders/FontLoader.js';
    import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // --- Music toggle ---------------------------------------------------------
    // Plays by default. Most browsers block sound until the visitor interacts,
    // so if autoplay is refused, start on the first click, tap or key press
    // anywhere (unless that interaction is the toggle itself).
    const music = document.getElementById('music');
    const soundToggle = document.getElementById('sound-toggle');
    music.volume = 0.6;
    soundToggle.addEventListener('click', () => {
      stopWaitingForGesture();
      if (music.paused) music.play().catch(() => {}); else music.pause();
    });
    function startOnGesture(e) {
      // The toggle and the Space shortcut handle themselves (otherwise the
      // first press would start the music and then immediately pause it).
      if (soundToggle.contains(e.target) || e.code === 'Space') return;
      stopWaitingForGesture();
      music.play().catch(() => {});
    }
    function stopWaitingForGesture() {
      removeEventListener('pointerdown', startOnGesture, true);
      removeEventListener('keydown', startOnGesture, true);
    }
    // Space toggles play/pause from anywhere on the page. A focused button or
    // form field keeps its own Space behavior, so we don't double-toggle.
    addEventListener('keydown', (e) => {
      if (e.code !== 'Space' || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.target.closest('button, a, input, textarea, select, [contenteditable]')) return;
      e.preventDefault();
      soundToggle.click();
    });
    music.play().catch(() => {
      addEventListener('pointerdown', startOnGesture, true);
      addEventListener('keydown', startOnGesture, true);
    });
    function syncSoundToggle() {
      const playing = !music.paused;
      soundToggle.setAttribute('aria-pressed', String(playing));
      soundToggle.setAttribute('aria-label', playing ? 'Pause music' : 'Play music');
    }
    music.addEventListener('play', syncSoundToggle);
    music.addEventListener('pause', syncSoundToggle);

    const FONT_URL = 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/fonts/helvetiker_bold.typeface.json';
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // --- Renderer / scene / camera ---------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x12002a, 0.0035);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 3000);

    // --- Deep-space background gradient -----------------------------------
    {
      const c = document.createElement('canvas');
      c.width = 2; c.height = 512;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 512);
      grad.addColorStop(0.0, '#02010a');
      grad.addColorStop(0.55, '#0d0430');
      grad.addColorStop(0.8, '#3a0a5e');
      grad.addColorStop(1.0, '#120022');
      g.fillStyle = grad;
      g.fillRect(0, 0, 2, 512);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      scene.background = tex;
    }

    // --- 80s chrome environment: sky -> hot horizon -> dark ground --------
    // Rendered once into a PMREM env map so the metal reflects a sunset band.
    {
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envScene = new THREE.Scene();
      const envMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        vertexShader: `
          varying vec3 vDir;
          void main() {
            vDir = normalize(position);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: `
          varying vec3 vDir;
          void main() {
            float y = vDir.y;
            vec3 sky     = mix(vec3(1.0, 0.35, 0.75), vec3(0.05, 0.1, 0.6), smoothstep(0.0, 0.6, y));
            vec3 ground  = mix(vec3(0.15, 0.0, 0.25), vec3(0.01, 0.0, 0.03), smoothstep(0.0, -0.5, y));
            vec3 col = y > 0.0 ? sky : ground;
            // Bright white-hot horizon line: the classic chrome "crease".
            col += vec3(1.0, 0.9, 1.0) * exp(-abs(y) * 60.0) * 3.0;
            // Soft cyan highlight up top for extra sparkle.
            col += vec3(0.4, 0.9, 1.0) * smoothstep(0.85, 1.0, y) * 1.5;
            gl_FragColor = vec4(col, 1.0);
          }`,
      });
      envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 64, 32), envMat));
      scene.environment = pmrem.fromScene(envScene, 0.02).texture;
      pmrem.dispose();
    }

    // --- Starfield (warping toward the camera) ----------------------------
    const STAR_COUNT = 4000;
    const STAR_DEPTH = 1600;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
      starPos[i * 3]     = (Math.random() - 0.5) * 1200;
      starPos[i * 3 + 1] = (Math.random() - 0.5) * 800;
      starPos[i * 3 + 2] = -Math.random() * STAR_DEPTH;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starSprite = (() => {
      const c = document.createElement('canvas');
      c.width = c.height = 64;
      const g = c.getContext('2d');
      const r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      r.addColorStop(0, 'rgba(255,255,255,1)');
      r.addColorStop(0.3, 'rgba(200,220,255,0.6)');
      r.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = r;
      g.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    })();
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
      size: 3, map: starSprite, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, fog: false,
    }));
    scene.add(stars);

    // --- Neon grid floor ---------------------------------------------------
    const GRID_CELL = 20;
    const grid = new THREE.GridHelper(2000, 2000 / GRID_CELL, 0xff2bd6, 0xff2bd6);
    grid.material.transparent = true;
    grid.material.opacity = 0.55;
    grid.position.y = -28;
    scene.add(grid);

    // --- Lights (accents on top of the env map) ----------------------------
    const magenta = new THREE.PointLight(0xff2bd6, 600, 300);
    magenta.position.set(-60, 20, 40);
    const cyan = new THREE.PointLight(0x2be8ff, 600, 300);
    cyan.position.set(60, -10, 40);
    scene.add(magenta, cyan);

    // --- Chrome text --------------------------------------------------------
    const title = new THREE.Group();
    scene.add(title);

    // Front faces: hand-painted 80s chrome gradient (sky -> white crease -> warm
    // horizon), since flat faces only reflect one direction of the env map.
    // A diagonal glint sweeps across every few seconds.
    const glint = { value: -2 };
    function makeFaceMat(minY, maxY) {
      return new THREE.ShaderMaterial({
        uniforms: { uMinY: { value: minY }, uMaxY: { value: maxY }, uGlint: glint },
        vertexShader: `
          varying vec3 vPos;
          void main() {
            vPos = position;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }`,
        fragmentShader: `
          uniform float uMinY, uMaxY, uGlint;
          varying vec3 vPos;
          void main() {
            float t = clamp((vPos.y - uMinY) / (uMaxY - uMinY), 0.0, 1.0);
            vec3 col;
            if (t > 0.5) {
              float k = (t - 0.5) / 0.5;
              col = mix(vec3(0.95, 0.97, 1.0), vec3(0.55, 0.8, 1.0), smoothstep(0.0, 0.25, k));
              col = mix(col, vec3(0.08, 0.2, 0.65), smoothstep(0.25, 1.0, k));
            } else {
              float k = t / 0.5;
              col = mix(vec3(0.25, 0.05, 0.2), vec3(1.0, 0.45, 0.75), smoothstep(0.0, 0.7, k));
              col = mix(col, vec3(1.0, 0.85, 0.95), smoothstep(0.85, 1.0, k));
            }
            // Hard horizon crease.
            col = mix(col, vec3(0.15, 0.03, 0.15), smoothstep(0.5, 0.49, t) * smoothstep(0.44, 0.49, t));
            // Sweeping diagonal glint.
            float d = (vPos.x * 0.02 + t) - uGlint;
            col += vec3(1.0) * exp(-d * d * 400.0) * 0.9;
            gl_FragColor = vec4(col, 1.0);
            #include <colorspace_fragment>
          }`,
      });
    }
    const sideMat = new THREE.MeshPhysicalMaterial({
      color: 0xb8a8ff, metalness: 1, roughness: 0.12,
      clearcoat: 1, envMapIntensity: 1.2, fog: false,
    });

    function makeLine(font, text, size) {
      const geo = new TextGeometry(text, {
        font, size, depth: size * 0.45, curveSegments: 6,
        bevelEnabled: true, bevelThickness: size * 0.08, bevelSize: size * 0.05, bevelSegments: 4,
      });
      geo.center();
      geo.computeBoundingBox();
      const { min, max } = geo.boundingBox;
      return new THREE.Mesh(geo, [makeFaceMat(min.y, max.y), sideMat]);
    }

    let titleSize = new THREE.Vector3();

    new FontLoader().load(FONT_URL, (font) => {
      const top = makeLine(font, 'STUPID', 14);
      const bottom = makeLine(font, 'INTELLIGENCE (SI)', 8);
      // Stack the lines with a tight gap, centered on the group's origin so it
      // spins around its middle.
      const LINE_GAP = 2;
      const topH = top.geometry.boundingBox.max.y - top.geometry.boundingBox.min.y;
      const bottomH = bottom.geometry.boundingBox.max.y - bottom.geometry.boundingBox.min.y;
      const total = topH + LINE_GAP + bottomH;
      top.position.y = total / 2 - topH / 2;
      bottom.position.y = -total / 2 + bottomH / 2;
      title.add(top, bottom);
      new THREE.Box3().setFromObject(title).getSize(titleSize);
      fitCamera();
      startIntro();
    }, undefined, () => {
      document.getElementById('fallback').hidden = false;
      startIntro();
    });

    // --- Intro: fade up from black while the title scales in -----------------
    const INTRO_DURATION = 2.2;  // seconds for the title to grow to full size
    const INTRO_FROM = 0.35;     // starting scale
    let introStart = null;
    function startIntro() {
      if (introStart !== null) return;
      introStart = clock.elapsedTime;
      document.getElementById('intro').classList.add('done');
    }
    // Don't leave visitors staring at black if the font is slow.
    setTimeout(startIntro, 4000);
    // Ease out with a slight overshoot, so it lands with a little punch.
    function easeOutBack(k) {
      const c = 1.4;
      return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2);
    }

    // --- Post-processing: bloom for the neon glow --------------------------
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.4, 0.9);
    composer.addPass(bloom);
    composer.addPass(new OutputPass());

    // --- Keep the title centered and fully visible at any aspect ratio -----
    function fitCamera() {
      const w = titleSize.x || 110;
      const h = titleSize.y || 40;
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const margin = 1.25;
      const distForH = (h * margin / 2) / Math.tan(vFov / 2);
      const distForW = (w * margin / 2) / (Math.tan(vFov / 2) * camera.aspect);
      camera.position.set(0, 10, Math.max(distForH, distForW) + titleSize.z);
      camera.lookAt(0, -2, 0);
    }

    function onResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      fitCamera();
    }
    addEventListener('resize', onResize);
    onResize();

    // Subtle parallax with the pointer.
    const pointer = new THREE.Vector2();
    addEventListener('pointermove', (e) => {
      pointer.set(e.clientX / innerWidth - 0.5, e.clientY / innerHeight - 0.5);
    });

    // --- Grab and stretch the title (rubber band) ------------------------------
    // Dragging twists the title against a rubber band anchored at its resting
    // pose: the further you pull, the harder it resists, up to a maximum twist.
    // Letting go snaps it back with an overshoot and wobble; throwing it spins it
    // off with the finger's momentum, friction slows it, and it glides home.
    // Rotations are in screen space, so dragging sideways always twists it sideways.
    const DRAG_SPEED = 0.009;   // radians per pixel at the start of a pull
    const MAX_TWIST = 2.6;      // radians (~150 degrees) the band can never stretch past
    const DRAG_LAG = 14;        // how tightly the text follows the finger (1/s): lower = heavier
    const SPRING_K = 60;        // snap-back stiffness: higher returns faster
    const SPRING_DAMPING = reducedMotion ? 1 : 0.3;  // damping ratio: lower = more wobble
    const THROW_MIN = 4;        // rad/s: release faster than this counts as a throw
    const MAX_SPIN = 20;        // rad/s cap so a wild throw stays readable
    const AIR_DRAG = 0.9;       // throw decay proportional to speed (1/s)
    const FRICTION = 1.5;       // constant throw deceleration (rad/s^2)
    const HOMING_PULL = 15;     // rad/s^2 cap on the spring while gliding home from a throw
    const spin = new THREE.Vector3();        // world-space angular velocity in rad/s
    const fingerVel = new THREE.Vector2();   // px/s, smoothed
    let dragging = false, thrown = false, grabX = 0, grabY = 0, lastX = 0, lastY = 0, lastMoveTime = 0;
    const grabQuat = new THREE.Quaternion();
    const pullTarget = new THREE.Vector2(), pullShown = new THREE.Vector2();
    const canvas = renderer.domElement;

    const qStep = new THREE.Quaternion(), qErr = new THREE.Quaternion();
    const stepAxis = new THREE.Vector3(), springErr = new THREE.Vector3();

    // Twist for a pull of (px, py) pixels. Starts at DRAG_SPEED rad/px and
    // flattens out toward MAX_TWIST, so every extra pixel turns it less.
    function applyPull(px, py) {
      const pull = Math.hypot(px, py);
      title.quaternion.copy(grabQuat);
      if (pull === 0) return;
      const linear = pull * DRAG_SPEED;
      const angle = MAX_TWIST * linear / (linear + MAX_TWIST);
      stepAxis.set(py / pull, px / pull, 0);
      title.quaternion.premultiply(qStep.setFromAxisAngle(stepAxis, angle));
    }
    // Rotate by a world-space angular velocity over dt.
    function rotateByVelocity(w, dt) {
      const speed = w.length();
      if (speed === 0) return;
      title.quaternion.premultiply(qStep.setFromAxisAngle(stepAxis.copy(w).divideScalar(speed), speed * dt));
    }
    // Shortest rotation from the title's orientation to q, as axis * angle.
    function rotationTo(q, out) {
      qErr.copy(title.quaternion).invert().premultiply(q);
      if (qErr.w < 0) qErr.set(-qErr.x, -qErr.y, -qErr.z, -qErr.w);
      out.set(qErr.x, qErr.y, qErr.z);
      const s = out.length();
      return s < 1e-6 ? out.multiplyScalar(2) : out.multiplyScalar(2 * Math.atan2(s, qErr.w) / s);
    }

    canvas.addEventListener('pointerdown', (e) => {
      dragging = true;
      lastX = grabX = e.clientX; lastY = grabY = e.clientY;
      lastMoveTime = performance.now();
      fingerVel.set(0, 0);
      thrown = false;
      grabQuat.copy(title.quaternion);
      pullTarget.set(0, 0);
      pullShown.set(0, 0);
      spin.set(0, 0, 0);
      canvas.setPointerCapture(e.pointerId);
      canvas.classList.add('dragging');
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      pullTarget.set(e.clientX - grabX, e.clientY - grabY);
      const now = performance.now();
      const dts = Math.max((now - lastMoveTime) / 1000, 1 / 240);
      // Smooth the velocity estimate so a jittery last event doesn't kill the throw.
      fingerVel.lerp(new THREE.Vector2((e.clientX - lastX) / dts, (e.clientY - lastY) / dts), 0.5);
      lastX = e.clientX; lastY = e.clientY; lastMoveTime = now;
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      // A throw leaves the band behind: the finger's speed becomes spin.
      // Holding still before letting go means no throw.
      if (performance.now() - lastMoveTime < 80) {
        spin.set(fingerVel.y * DRAG_SPEED, fingerVel.x * DRAG_SPEED, 0).clampLength(0, MAX_SPIN);
        thrown = spin.length() > THROW_MIN;
        if (!thrown) spin.set(0, 0, 0);
      }
      canvas.classList.remove('dragging');
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // --- Animate ------------------------------------------------------------
    const clock = new THREE.Clock();
    const idleQuat = new THREE.Quaternion(), idleEuler = new THREE.Euler();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      const motion = reducedMotion ? 0.15 : 1;

      // Stars fly toward the camera and wrap around.
      const p = starGeo.attributes.position.array;
      for (let i = 2; i < p.length; i += 3) {
        p[i] += 120 * dt * motion;
        if (p[i] > 100) p[i] -= STAR_DEPTH;
      }
      starGeo.attributes.position.needsUpdate = true;

      // Grid scrolls forward endlessly.
      grid.position.z = (t * 40 * motion) % GRID_CELL;

      // Title: stretched by the drag, otherwise sprung back to the idle sway
      // (which tracks the pointer a little).
      if (dragging) {
        // Trail slightly behind the finger so the pull feels weighted.
        pullShown.lerp(pullTarget, 1 - Math.exp(-DRAG_LAG * dt));
        applyPull(pullShown.x, pullShown.y);
      } else {
        const targetY = Math.sin(t * 0.6) * 0.25 * motion + pointer.x * 0.4;
        const targetX = Math.sin(t * 0.8) * 0.06 * motion + pointer.y * 0.25;
        idleQuat.setFromEuler(idleEuler.set(targetX, targetY, 0));
        const speed = spin.length();
        if (thrown && speed > THROW_MIN) {
          // Coasting after a throw: air drag plus constant friction, no band yet.
          const next = Math.max(speed * Math.exp(-AIR_DRAG * dt) - FRICTION * dt, 0);
          spin.multiplyScalar(next / speed);
        } else {
          // Underdamped spring toward the resting pose: on release it snaps back,
          // overshoots and wobbles like a rubber band.
          rotationTo(idleQuat, springErr);
          let angle = springErr.length();
          if (thrown) {
            // Keep going the way it was thrown rather than reversing to take the
            // short way home.
            if (angle > Math.PI / 2 && spin.dot(springErr) < 0) {
              springErr.multiplyScalar((angle - Math.PI * 2) / angle);
              angle = Math.PI * 2 - angle;
            }
            if (angle < 0.3) thrown = false;
          }
          springErr.multiplyScalar(SPRING_K);
          // Gentle pull while gliding home from a throw, so it eases in rather than whipping.
          if (thrown) springErr.clampLength(0, HOMING_PULL);
          const c = 2 * SPRING_DAMPING * Math.sqrt(SPRING_K);
          spin.addScaledVector(springErr, dt).addScaledVector(spin, -c * dt);
        }
        rotateByVelocity(spin, dt);
      }
      title.position.y = Math.sin(t * 1.2) * 1.2 * motion;
      if (introStart !== null && !reducedMotion) {
        const k = Math.min((t - introStart) / INTRO_DURATION, 1);
        title.scale.setScalar(INTRO_FROM + (1 - INTRO_FROM) * easeOutBack(k));
      }

      // Glint sweeps across the faces, then pauses.
      glint.value = ((t * 0.5) % 3) * 1.6 - 1.5;

      // Sweep the accent lights so highlights glide across the chrome.
      magenta.position.x = Math.sin(t * 0.7) * 80;
      cyan.position.x = -Math.sin(t * 0.7 + 1) * 80;

      composer.render();
    });
  </script>
</body>
</html>
